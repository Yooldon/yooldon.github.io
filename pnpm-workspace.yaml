# pnpm 11 起，设置项从 .npmrc / package.json 的 pnpm 字段搬到了这里。
# 见 https://pnpm.io/settings

# 用 npm 式的扁平 node_modules（真实目录 + 硬链接）。
# 默认的 junction 方式在 Windows + Node 24 下会导致 ESM 解析不到依赖。
nodeLinker: hoisted

# 允许 esbuild 跑安装脚本（Vite 依赖它）
allowBuilds:
  esbuild: true

# 不要在每次 pnpm dev / build 之前自动跑 install。
# 依赖是别的 pnpm 版本装的，自动检查会想删掉 node_modules 重装，
# 在没有交互终端时直接失败。需要装依赖时手动 pnpm install。
verifyDepsBeforeRun: false
